name: Resolution Changer Pro APK Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set Up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set Up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Debug APK
    run: |
      if [ -f ./gradlew ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug
      else
        echo "ERROR: Android project and Gradle wrapper are missing."
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    if: success()
    with:
      name: ResolutionChangerPro-debug
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7